name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_API_URL: http://127.0.0.1:58080/api/v1
  NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
  NEXT_PUBLIC_DEMO_MODE: "false"

jobs:
  verify:
    name: npm ci, lint, typecheck, unit tests and production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: Targeted Playwright browser gate
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  image:
    name: Immutable image and provenance
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          labels: |
            org.opencontainers.image.title=necly-frontend
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=sha-${{ github.sha }}
          tags: |
            type=sha,prefix=sha-,format=long
      - name: Login to GHCR (push events only)
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build immutable image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_SITE_URL=${{ env.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_DEMO_MODE=${{ env.NEXT_PUBLIC_DEMO_MODE }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record build provenance
        run: |
          {
            echo "### Frontend image provenance"
            echo ""
            echo "- source_sha: \`${{ github.sha }}\`"
            echo "- image_digest: \`${{ steps.build.outputs.digest }}\`"
            echo "- image_ref: \`ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}\`"
            echo "- lockfile_sha256: \`$(sha256sum package-lock.json | awk '{print $1}')\`"
            echo "- build_args: \`NEXT_PUBLIC_API_URL=${{ env.NEXT_PUBLIC_API_URL }}\`, \`NEXT_PUBLIC_SITE_URL=${{ env.NEXT_PUBLIC_SITE_URL }}\`, \`NEXT_PUBLIC_DEMO_MODE=${{ env.NEXT_PUBLIC_DEMO_MODE }}\`"
            echo "- base image: \`node:24-alpine\` from the Dockerfile"
          } >> "$GITHUB_STEP_SUMMARY"
